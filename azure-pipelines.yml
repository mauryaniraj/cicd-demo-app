# Azure DevOps pipeline: build + test, then (optionally) push image to Docker Hub.
# It is NOT started by Azure itself. GitHub Actions starts it through the REST API.
trigger: none
pr: none

parameters:
  - name: pushImage
    displayName: Push image to Docker Hub?
    type: string
    default: 'false'
    values:
      - 'false'
      - 'true'

variables:
  imageRepository: 'YOUR_DOCKERHUB_USERNAME/cicd-demo-app'
  AWS_REGION: 'us-east-1'
  AWS_ACCOUNT_ID: '123456789012'
  CONFIG_REPO: 'GITHUB_USER/cicd-demo-config'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: Maven
        steps:
          - task: JavaToolInstaller@0
            displayName: Use Java 17
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: mvn -B clean verify
            displayName: Compile and run unit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'

  - stage: PushImage
    displayName: Push image to Docker Hub
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq('${{ parameters.pushImage }}', 'true'))
    jobs:
      - job: Docker
        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              containerRegistry: 'dockerhub-connection'
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: Dockerfile
              tags: |
                $(Build.BuildId)
                latest

          - script: |
              set -euo pipefail
              REGISTRY=$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com
              ECR_IMAGE=$REGISTRY/cicd-demo-app:$(Build.BuildId)
              aws ecr get-login-password --region $(AWS_REGION) \
                | docker login --username AWS --password-stdin $REGISTRY
              docker build -t $ECR_IMAGE .
              docker push $ECR_IMAGE
            displayName: Build and push to AWS ECR (build-number tag only)
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

          - script: |
              set -euo pipefail
              git clone https://x-access-token:$(CONFIG_REPO_TOKEN)@github.com/$(CONFIG_REPO).git config
              cd config
              sed -i 's|^  tag:.*|  tag: "$(Build.BuildId)"|' charts/cicd-demo-app/values.yaml
              git config user.name "azure-pipelines"
              git config user.email "azure-pipelines@users.noreply.github.com"
              git commit -am "cicd-demo-app: deploy build $(Build.BuildId)"
              git push origin main
            displayName: Update image tag in the config repo (GitOps)
            env:
              CONFIG_REPO_TOKEN: $(CONFIG_REPO_TOKEN)